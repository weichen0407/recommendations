[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recommendation-contents"
version = "0.1.0"
description = "A LangGraph framework for topic prompt generation and curl task execution."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27.0",
  "langchain-openai>=0.1.0",
  "langgraph>=0.2.0",
  "playwright>=1.47.0",
  "typing-extensions>=4.0.0",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.3.0",
  "pytest>=8.0",
  "ruff>=0.6.0",
]

[project.scripts]
recommendation-graph = "recommendation_contents.main:main"
topic-workflow = "recommendation_contents.main:main"
content-brief-workflow = "recommendation_contents.brief_cli:main"
profile-topic-node1 = "recommendation_contents.profile_topic_cli:main"
eureka-token = "recommendation_contents.token_cli:main"
eureka-auth-watcher = "recommendation_contents.auth_watcher:main"
eureka-completion = "recommendation_contents.completion_cli:main"
case-workflow = "recommendation_contents.cases_cli:main"
industry-case-workflow = "recommendation_contents.industry_cases_cli:main"
records-to-plg = "recommendation_contents.plg_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recommendation_contents = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
